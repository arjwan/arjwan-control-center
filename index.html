function monitorView(){const title=page==='servers'?'السيرفرات':page==='databases'?'قواعد البيانات':page==='updates'?'تحديثات المستودعات':'مراقبة الخدمات';let h=head(title,'فحص الوصول إلى الروابط المسجلة، دون تعديل الخدمات.','<button class="primary" onclick="checkStatus()" '+(checking?'disabled':'')+'>'+(checking?'جارٍ الفحص…':'↻ فحص الآن')+'</button>');h+='<div class="notice">فحص روابط HTTP فقط؛ لا يثبت سلامة وظائف التطبيق أو قاعدة بياناته. الروابط من ملف المشروع وتحتاج مطابقة مع النشر المعتمد. التحديثات تخص الفرع الافتراضي، ولا تثبت نشر الإصدار.</div>';if(monitorError)h+='<div class="notice" role="alert">'+esc(monitorError)+(report?' — النتائج السابقة معروضة بتاريخها.':'')+'</div>';if(page==='databases')return h+'<div class="card"><h2>ربط قواعد البيانات</h2><p>لم تُضف صلاحيات قراءة لقواعد البيانات. استجابة الموقع لا تعني أن قاعدة بياناته سليمة.</p><span class="tag">غير مربوط</span></div>';if(!report)return h+'<div class="card">'+empty('◉','اضغط «فحص الآن» للحصول على نتيجة من الخادم.<br><span class="muted">لا توجد نتائج مفترضة أو بيانات تجريبية للمراقبة.</span>')+'</div>';h+='<p class="muted">آخر فحص: '+esc(new Date(report.checkedAt).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'}))+' — توقيت بغداد</p>';if(page==='updates')return h+table(['المستودع','آخر تحديث','الرسالة','النتيجة'],report.repos.map(r=>[esc(r.repo),esc(r.sha||'—'),esc(r.message||r.error||'—'),r.ok?'تمت القراءة':esc('تعذر التحقق'+(r.httpStatus?' — HTTP '+r.httpStatus:''))]));return h+table(['الخدمة','الحالة','HTTP','الاستجابة','الخادم'],report.services.map(r=>[esc(r.name)+'<div class="muted" dir="ltr">'+esc(r.url)+'</div>','<span class="tag '+(r.status==='reachable'?'success':'danger')+'">'+esc(statusLabels[r.status])+'</span>',esc(r.httpStatus||'—'),esc(r.latencyMs)+' ms',esc(r.server||'—')]))}
async function checkStatus(){if(checking)return;checking=true;monitorError='';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch('/api/status',{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});if(!response.ok)throw new Error('HTTP '+response.status);const type=response.headers.get('content-type')||'';if(!type.includes('application/json'))throw new Error('الخادم لم يُعد JSON');const result=await response.json();if(!Array.isArray(result.services)||!Array.isArray(result.repos)||!result.checkedAt)throw new Error('بيانات الفحص غير مكتملة');report=result}catch(e){monitorError='تعذر تحديث الفحص: '+(e.name==='AbortError'?'انتهت المهلة':e.message)}finally{clearTimeout(timer);checking=false;render()}}
